let S=JSON.parse(localStorage.getItem('pros50_v2')||'{}');
let F='all';
function save(){localStorage.setItem('pros50_v2',JSON.stringify(S));}
function setP(i,v){ if(S[i]===v) delete S[i]; else S[i]=v; save(); render(); }
function clearAll(){ if(confirm('Limpar favoritos?')){S={};save();render();} }
function exportFav(){
 let rows=[['nome','cidade','nicho','telefone','instagram','status','resumo']];
 D.forEach((d,i)=>{ if(S[i]==='fav'||S[i]==='hot'){ rows.push([d.n,d.c,d.t,d.pd||'',d.ig||'',S[i],d.s]); }});
 if(rows.length===1){alert('Marca ★ ou 🔥 primeiro');return;}
 let csv=rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n');
 let b=new Blob([csv],{type:'text/csv'}); let a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='favoritos.csv'; a.click();
}
function render(){
 let q=(document.getElementById('q').value||'').toLowerCase();
 let g=document.getElementById('g'); g.innerHTML='';
 let nf=0,nh=0; Object.values(S).forEach(v=>{if(v==='fav')nf++; if(v==='hot')nh++;});
 document.getElementById('nfav').textContent='('+nf+')';
 document.getElementById('nhot').textContent='('+nh+')';
 let shown=0;
 D.forEach((d,i)=>{
  let st=S[i]||'';
  if(F==='fav'&&st!=='fav')return;
  if(F==='hot'&&st!=='hot')return;
  if(F==='tel'&&!d.p)return;
  if(F==='nosite'&&d.p)return;
  if(q && !(d.n+' '+d.c+' '+d.t).toLowerCase().includes(q))return;
  shown++;
  let cls=st==='fav'?'fav':st==='hot'?'hot':st==='done'?'done':'';
  let badge=st==='fav'?'⭐':st==='hot'?'🔥':st==='done'?'✅':'';
  let tel=d.p?`<a class=btn href='tel:+${d.p}'>📞 ${d.pd}</a> <a class='btn wa' href='https://wa.me/${d.p}'>Whats</a>`:`<a class=btn href='https://www.google.com/maps/search/${encodeURIComponent(d.n+' '+d.c)}' target=_blank>📍 Maps</a>`;
  let ig=d.ig?`<a class='btn ig' href='https://www.instagram.com/${d.ig}' target=_blank>IG</a>`:`<a class='btn ig' href='https://www.google.com/search?q=${encodeURIComponent(d.n+' '+d.c+' instagram')}' target=_blank>IG?</a>`;
  g.innerHTML+=`<div class='card ${cls}'><div class=badge>${badge}</div><b>${i+1}. ${d.n}</b><div class=small>${d.c} - ${d.t} - ${d.p?'✅ '+d.pd:'🟠 '+d.pd}</div><div class=small><b>Resumo:</b> ${d.s}<br><b>Site:</b> ${d.a}</div><div>${tel} ${ig}</div><div style='margin-top:6px'><button class='btn prio' onclick="setP(${i},'fav')">★ Fav</button><button class='btn prio' onclick="setP(${i},'hot')">🔥 Quente</button><button class='btn prio' onclick="setP(${i},'done')">✅ Liguei</button></div></div>`;
 });
 document.getElementById('cnt').textContent=shown+' / '+D.length;
 ['all','fav','hot','tel','nosite'].forEach(k=>{document.getElementById('b_'+k).classList.toggle('on',F===k);});
}
render();
